<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D1B2A" />

    <title>COUNTERSIGN — every claim proves where it came from</title>
    <meta
      name="description"
      content="Financial risk analysis that traces every claim to the exact sentence it came from. Nothing is generated."
    />

    <!-- Fonts are self-hosted; preload the two that appear above the fold. -->
    <link
      rel="preload"
      href="/fonts/InstrumentSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Literata-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set the theme before first paint so there's no flash of the wrong
         one. Reads the same cookie useTheme() writes; falls back to the OS
         preference, then dark. Kept inline and tiny on purpose. -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|; )cs_theme=([^;]*)/);
          var t = m && decodeURIComponent(m[1]);
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
