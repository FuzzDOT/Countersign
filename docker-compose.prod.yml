# Production-ish overlay: built assets, no bind mounts, no reload.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#   make prod
#
# The frontend is built to static files and served by the backend container
# (api/main.py::_register_static), so the whole thing is one origin on port
# 8000. This is what we hand a judge.
#
# ENVIRONMENT is deliberately NOT set to `production` here. That looks like a
# downgrade and is the opposite:
#
#   core/config.py::check_production_safety() refuses to start under
#   ENVIRONMENT=production unless JWT_SECRET is a real 32+ char secret and
#   REFRESH_COOKIE_SECURE is true. A clean `make init` copies .env.example,
#   which ships the placeholder secret and cookie_secure=false — so this
#   overlay used to exit 78 ("FATAL: refusing to start") on exactly the
#   machine it exists to serve. Worse, satisfying the guard by setting
#   REFRESH_COOKIE_SECURE=true then stops the cs_refresh cookie travelling
#   over http://localhost, breaking silent refresh (frontend brief §19) on
#   the demo box.
#
#   Nothing is lost by leaving it: the strict CSP with no `unsafe-inline` is
#   keyed on `serve_static OR is_production` (api/middleware.py), so
#   SERVE_STATIC=true below turns it on. HSTS stays off, which is correct
#   over plain HTTP — sending it from a localhost demo pins a judge's browser
#   to https for a year.
#
# For a genuine internet-facing deploy, set ENVIRONMENT=production, generate
# JWT_SECRET with `openssl rand -hex 32`, set REFRESH_COOKIE_SECURE=true, and
# terminate TLS in front of this. The guard is there for that case.

services:
  db:
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=512MB
    ports: []

  backend:
    build:
      target: prod
    environment:
      SERVE_STATIC: "true"
      STATIC_DIR: /app/static
    volumes:
      - frontend_dist:/app/static:ro
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # No depends_on the frontend: the base compose already has frontend
    # depending on backend, and adding the reverse is a dependency cycle
    # compose refuses to start. Ordering is handled in the app instead —
    # _register_static resolves index.html per request, so the backend can
    # boot before the frontend build finishes copying and start serving the
    # bundle the moment it lands, with no restart.

  frontend:
    build:
      target: build
    # Build once, copy into the shared volume, then idle. The backend serves
    # these files; nothing is published from this container.
    command: ["sh", "-c", "npm run build && cp -r /app/dist/. /out/ && echo 'frontend build copied to volume' && sleep infinity"]
    environment:
      VITE_API_BASE_URL: /api/v1
    volumes:
      - frontend_dist:/out
    ports: []

volumes:
  frontend_dist:
