[project]
name = "countersign"
version = "0.1.0"
description = "Uncertainty-gated financial risk extraction with cited, non-generated insights"
requires-python = ">=3.11"

# ── ruff: linter + formatter ─────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["db/migrations/versions", ".venv", "data/generated"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "ASYNC",     # async correctness
  "S",         # bandit (security)
  "T20",       # no print statements
  "SIM",       # simplify
  "RUF",
]
# Mathematical notation, in docstrings that describe mathematics. `α_k` reads
# as the Dirichlet parameter it is; `a_k` reads as a variable name. The
# confusable check is there to catch homoglyph typos, not to ban notation.
allowed-confusables = ["α", "−", "–", "‖", "τ", "λ", "Σ", "×"]

ignore = [
  "E501",    # line length is the formatter's job
  "B008",    # FastAPI Depends() in defaults is the documented pattern
  "S101",    # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
"scripts/*" = ["T20"]      # scripts are allowed to print
# Non-crypto random is correct for synthetic data. `generate.py` and
# `fixtures.py` are also CLI reporters — `--report`, `--sample` and the
# fixture summary all print by design, and routing them through structlog
# would emit JSON at someone inspecting the corpus by hand.
"data/synth/*" = ["S311", "T201"]
# `fatal_config_exit` prints to stderr deliberately: it runs before logging
# is configured and the operator has to read it in `docker logs` without a
# JSON decoder.
"core/config.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = ["db/migrations/", "tests/", "data/generated/"]

# Third-party packages without stubs. Add here rather than sprinkling
# `# type: ignore` through the codebase.
[[tool.mypy.overrides]]
module = [
  "torch.*", "torch_geometric.*", "spacy.*", "nltk.*", "sklearn.*",
  "xgboost.*", "pgvector.*", "slowapi.*", "elevenlabs.*", "faker.*",
]
ignore_missing_imports = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: takes more than a few seconds (fuzzer, training)",
  "ml: requires model weights to be present",
  "integration: requires a live database",
]
# Strict on our own deprecations, permissive on everyone else's.
#
# This was originally a blanket `error::DeprecationWarning` plus an allowlist
# of third-party modules, which is unmaintainable: it requires predicting
# every dependency that will ever emit a deprecation, and a single miss stops
# the suite from even *collecting*. It failed on `anyio.abc.BlockingPortal`,
# emitted while importing `fastapi.testclient` — nothing to do with us, and
# the traceback reads like our bug.
#
# Inverted, the policy is the one the original comment described: third-party
# deprecations are displayed (so they are not invisible) but never fatal,
# while anything raised from our own packages is an error. Later entries take
# precedence over earlier ones in pytest, so the per-package rules win.
filterwarnings = [
  "default::DeprecationWarning",
  "default::PendingDeprecationWarning",
  "error::DeprecationWarning:api.*",
  "error::DeprecationWarning:core.*",
  "error::DeprecationWarning:db.*",
  "error::DeprecationWarning:data.*",
  "error::DeprecationWarning:ml.*",
  "error::DeprecationWarning:workers.*",
  "error::DeprecationWarning:scripts.*",
  "error::DeprecationWarning:tests.*",
]

[tool.coverage.run]
omit = ["tests/*", "db/migrations/*", "data/synth/*"]
